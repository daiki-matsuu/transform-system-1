<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>クイズ大会 メインスクリーン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===================== 画面サイズへの追従 =====================
 * 会場の大型スクリーンに投影すると、固定pxで書いた文字は画面に対して
 * 相対的に小さく見えてしまいます（ノートPCでちょうど良くても、同じ
 * ピクセル数のまま大画面に映るため）。
 * そこで、文字と枠の寸法をすべて rem（＝下のルート文字サイズの倍数）で
 * 指定し、ルート自体を画面の大きさに連動させています。
 * これにより、配置や余白の比率はそのままに、全体が画面いっぱいまで拡大します。
 *
 *   1280×720 のノートPC → 約1.3倍
 *   1920×1080 のスクリーン → 約2.0倍
 *   さらに大きい画面 → 上限まで比例して拡大
 *
 * 縦横どちらの比率にも収まるよう min() で小さい方を採用しているので、
 * 4:3のプロジェクターでも縦にはみ出しません。
 * ※もっと大きく／小さくしたい場合は、下の 1.65vw の数値だけ変えてください。
 */
html{ font-size: clamp(13px, min(1.65vw, 2.9vh), 46px); }

:root{
  --sky1:#bfe9f2; --sky2:#3aa8dd; --sky3:#1f6fb8;
  --navy:#0e2a4a;
  --gold:#ffd23f; --gold-deep:#f5a623;
  --silver:#d8e2ea;
  --red:#e2394b; --red-deep:#c1233a;
  --blue:#2f8fdd; --green:#38b06a; --yellow:#f0b429;
  --panel:#0e2a4ae6;
  --ink:#fff; --ink-navy:#0e2a4a;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; height:100%; overflow:hidden; font-family:'Noto Sans JP',sans-serif; background:var(--sky3);}
.num{font-family:'Oswald',sans-serif;}
.disp{font-family:'Zen Kaku Gothic New',sans-serif;}

#stage{
  position:relative; width:100vw; height:100vh; color:var(--ink);
  background:
    radial-gradient(1600px 1000px at 50% -10%, #dff6ff 0%, var(--sky2) 45%, var(--sky3) 100%);
  overflow:hidden;
}
/* きらきら背景（星・泡） */
.sparkle-bg{position:absolute; inset:0; pointer-events:none; opacity:.55;
  background-image:
    radial-gradient(3px 3px at 8% 15%, #fff 0, transparent 60%),
    radial-gradient(2px 2px at 22% 60%, #fff 0, transparent 60%),
    radial-gradient(3px 3px at 40% 22%, #fff 0, transparent 60%),
    radial-gradient(2px 2px at 60% 75%, #fff 0, transparent 60%),
    radial-gradient(3px 3px at 75% 30%, #fff 0, transparent 60%),
    radial-gradient(2px 2px at 90% 65%, #fff 0, transparent 60%),
    radial-gradient(2px 2px at 15% 85%, #fff 0, transparent 60%),
    radial-gradient(3px 3px at 85% 10%, #fff 0, transparent 60%);
  background-size:100% 100%;
}
.bubble{position:absolute; border-radius:50%; background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), rgba(255,255,255,0.05));
  pointer-events:none; animation:floatUp linear infinite;}
@keyframes floatUp{
  0%{ transform:translate(0,20px) scale(0.9); opacity:0; }
  10%{ opacity:.6; }
  90%{ opacity:.5; }
  100%{ transform:translate(var(--drift,30px), -110vh) scale(1.05); opacity:0; }
}
.star-fx{position:absolute; pointer-events:none; color:#fff; opacity:.8; filter:drop-shadow(0 0 6px rgba(255,255,255,0.8));
  animation:twinkle ease-in-out infinite, driftX linear infinite;}
@keyframes twinkle{ 0%,100%{opacity:.25; transform:scale(0.8) rotate(0deg);} 50%{opacity:.95; transform:scale(1.15) rotate(20deg);} }
@keyframes driftX{ 0%{ margin-left:0; } 100%{ margin-left:var(--driftx,-40px); } }
.sparkle-bg{animation:sparklePulse 6s ease-in-out infinite;}
@keyframes sparklePulse{ 0%,100%{opacity:.4;} 50%{opacity:.75;} }

/* きらめくゴールドテキスト（タイトル・待機画面用） */
.shine-gold{
  background:linear-gradient(100deg, #fff6d0 0%, var(--gold) 25%, #fff 45%, var(--gold-deep) 65%, #fff6d0 100%);
  background-size:250% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:shineMove 3.2s linear infinite;
}
@keyframes shineMove{ 0%{background-position:0% 50%;} 100%{background-position:250% 50%;} }

/* ===================== ヘッダー ===================== */
header{position:relative; z-index:3; display:flex; align-items:center; justify-content:space-between; padding:1rem 2.5rem 0.25rem;}
/* 途中順位・最終結果の画面ではヘッダーを隠す。
   display:none にすると下のレイアウト（height:calc(100vh - 4.125rem)）がずれるため、
   場所は確保したまま visibility で消す。 */
#stage.board-mode header{visibility:hidden;}
.phase-badge{padding:0.4375rem 1.25rem; border-radius:1.5rem; font-weight:900; font-size:0.8125rem; letter-spacing:.08em; color:#fff;
  background:rgba(14,42,74,0.55); border:2px solid rgba(255,255,255,0.5);}
.phase-badge.open{background:rgba(56,176,106,0.75); border-color:#38b06a;}
.phase-badge.closed{background:rgba(240,180,41,0.8); border-color:var(--yellow);}
.phase-badge.revealed{background:rgba(226,57,75,0.8); border-color:var(--red);}
/* オッズ倍率バッジ（等倍のときは非表示） */
.mult-badge{
  display:none; margin-left:0.75rem; padding:0.4375rem 1.125rem 0.375rem; border-radius:1.5rem;
  font-family:'Oswald',sans-serif; font-weight:700; font-size:1.1875rem; color:#3a1f00;
  background:linear-gradient(180deg,#ffe066,#f5a623);
  border:2px solid #fff3c4; box-shadow:0 0 18px rgba(255,180,40,0.85), 0 3px 10px rgba(0,0,0,0.35);
  animation:multPulse .9s ease-in-out infinite alternate;
}
.mult-badge.show{display:block;}
@keyframes multPulse{
  from{transform:scale(1); box-shadow:0 0 14px rgba(255,180,40,0.6), 0 3px 10px rgba(0,0,0,0.35);}
  to{transform:scale(1.07); box-shadow:0 0 30px rgba(255,200,60,1), 0 3px 10px rgba(0,0,0,0.35);}
}
.conn-status{flex:1; text-align:center; font-size:0.8125rem; font-weight:900; color:transparent; letter-spacing:.04em;}
.conn-status.bad{color:#ffd23f; text-shadow:0 0 12px rgba(226,57,75,0.9);}

/* ===================== クイズ画面 ===================== */
#quizScreen{position:relative; z-index:2; height:calc(100vh - 4.125rem); display:flex; gap:1.375rem; padding:0.375rem 2.5rem 1.625rem;}
.quiz-left{flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:1.25rem;}

.qcard{
  position:relative; border-radius:1.375rem; overflow:hidden; display:block;
  box-shadow:0 8px 26px rgba(0,0,0,0.25); border:4px solid #ffffffcc;
  transition:transform .4s ease, box-shadow .4s ease, opacity .4s ease, filter .4s ease;
}
/* 画像/動画はカード全面（従来の黄色い背景部分＋選択肢テキスト部分）をすべて使って表示する */
.qcard .media{
  position:absolute; inset:0; background:linear-gradient(180deg,#fff7d6,#ffe397);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.qcard .media img, .qcard .media video{width:100%; height:100%; object-fit:cover;}
.qcard .media .placeholder-letter{font-family:'Oswald',sans-serif; font-weight:700; font-size:4rem; color:#f4d888; opacity:.7;}
/* 選択肢テキストはメディアの上に半透明で重ねる。下端からのグラデーションにすることで、
   文字の可読性を確保しつつ、背景の画像/動画全体が視認できるようにしている */
.qcard .label{
  position:absolute; left:0; right:0; bottom:0; z-index:2;
  min-height:3.75rem; display:flex; align-items:center; gap:0.75rem; padding:0.875rem 1.125rem 0.75rem;
  background:linear-gradient(180deg, rgba(14,42,74,0) 0%, rgba(14,42,74,0.55) 45%, rgba(14,42,74,0.82) 100%);
  text-shadow:0 2px 6px rgba(0,0,0,0.85);
}
.qcard .badge{
  width:2.125rem; height:2.125rem; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:'Oswald',sans-serif; font-weight:700; font-size:1.125rem; color:#fff; flex-shrink:0;
  box-shadow:0 0 0 2px rgba(255,255,255,0.7);
}
.qcard[data-c="A"] .badge{background:var(--blue);}
.qcard[data-c="B"] .badge{background:var(--red);}
.qcard[data-c="C"] .badge{background:var(--green);}
.qcard[data-c="D"] .badge{background:var(--yellow);}
.qcard .label .txt{font-weight:900; font-size:1rem; color:#fff; line-height:1.25;}
.qcard .odds-badge{
  position:absolute; top:0.625rem; right:0.625rem; z-index:3;
  background:linear-gradient(180deg,#fff3c4,var(--gold-deep));
  color:#5a3800; font-family:'Oswald',sans-serif; font-weight:700; font-size:1.1875rem; padding:0.25rem 0.75rem 0.1875rem;
  border-radius:1.25rem; box-shadow:0 3px 10px rgba(0,0,0,0.35); display:none;
}
.qcard .odds-badge.show{display:block;}

.qcard.correct{transform:scale(1.035); box-shadow:0 0 0 6px var(--gold), 0 10px 40px rgba(255,210,63,0.7); z-index:2;}
.qcard.wrong{opacity:.4; filter:grayscale(.7);}

.quiz-right{width:14.375rem; display:flex; flex-direction:column; gap:0.875rem;}
.q-topbadge{
  align-self:flex-start; background:linear-gradient(180deg,#6a3fb0,#3d2170); border-radius:1rem 1rem 0 0;
  padding:0.625rem 1.375rem; font-family:'Oswald',sans-serif; font-weight:700; font-size:1.875rem; color:#7ee8e0;
  box-shadow:0 -2px 0 rgba(255,255,255,0.15) inset;
}
.q-textbox{
  flex:1; background:linear-gradient(180deg,#fbfdff,#eef4fb); border-radius:0 1rem 1rem 1rem;
  padding:1.25rem 0.875rem; overflow-y:auto; display:flex; justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,0.2);
}
.q-textbox .vtext{
  writing-mode:vertical-rl; text-orientation:mixed; color:#1b2b57; font-weight:900; font-size:1.375rem;
  line-height:1.9; letter-spacing:.03em; max-height:100%;
}
/* 縦中横：半角の数字・アルファベットの短い並びを、正立させて横に組む
   （「2026」「AI」などが寝た状態にならず、自然な縦書きとして読める） */
.q-textbox .vtext .tcy{
  -webkit-text-combine:horizontal;   /* 古いWebKit（Safari）向け */
  -ms-text-combine-horizontal:all;   /* 旧Edge向け */
  text-combine-upright:all;
  letter-spacing:0;                  /* 組んだ中では字間を詰めて潰れを防ぐ */
}
/* 長い英単語は、日本語の縦書きの慣習どおり寝かせたまま表示する
   （無理に縦中横にすると潰れて読めなくなるため） */
.q-textbox .vtext .tcy-long{
  text-orientation:mixed; letter-spacing:0;
}
.final-tag{
  align-self:center; background:linear-gradient(90deg,var(--red),#ff6b7e); color:#fff; font-weight:900;
  font-size:0.8125rem; letter-spacing:.12em; padding:0.375rem 1rem; border-radius:1.25rem; display:none;
  box-shadow:0 0 18px rgba(226,57,75,0.7);
}
.final-tag.show{display:block;}
.timer-circle{
  align-self:center; width:6.875rem; height:6.875rem; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ff6b7a, var(--red-deep));
  display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(226,57,75,0.55), 0 0 0 6px rgba(255,255,255,0.5);
}
.timer-circle .n{font-family:'Oswald',sans-serif; font-weight:700; font-size:3.25rem; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,0.3);}
.timer-circle.urgent{animation:tpulse .5s infinite alternate;}
@keyframes tpulse{from{transform:scale(1)} to{transform:scale(1.08)}}

/* ===================== レイアウトB：大メディア＋テキスト選択肢 ===================== */
#quizScreenB{position:relative; z-index:2; height:calc(100vh - 4.125rem); display:none; gap:1.375rem; padding:0.375rem 2.5rem 1.625rem;}
#quizScreenB.show{display:flex;}
.bigq-main{flex:1; display:flex; flex-direction:column; gap:0.875rem; min-width:0;}

/* 上部およそ2/3：大きなメディア枠（水色一色・左右を少し内側に寄せる） */
.bigq-media{
  flex:2.15; position:relative; margin:0 6%; border-radius:1.625rem; overflow:hidden;
  background:linear-gradient(180deg,#bfdaf1 0%, #a6c6e4 100%);
  border:5px solid #e2f0fb;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 10px 32px rgba(0,0,0,0.32), inset 0 3px 14px rgba(255,255,255,0.55);
}
/* 背景の水色が見えるよう、余白は塗りつぶさず枠の色をそのまま活かす */
.bigq-media img, .bigq-media video, .bigq-media iframe{
  width:100%; height:100%; object-fit:contain; border:0; background:transparent;
}
.bigq-media .placeholder-letter{
  font-family:'Oswald',sans-serif; font-weight:700; font-size:5.75rem; color:#ffffff; opacity:.55;
  text-shadow:0 2px 8px rgba(40,90,140,0.45);
}

/* 下部およそ1/3：テキストのみの選択肢（2×2のピル型ボタン） */
.bigq-choices{flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:0.8125rem; min-height:0;}
.bigq-card{
  position:relative; display:flex; align-items:center; gap:0.9375rem; padding:0 1.625rem;
  background:linear-gradient(180deg,#112449 0%, #060c1c 100%);
  border:2px solid rgba(150,200,255,0.55); border-radius:62.4375rem;
  box-shadow:0 6px 18px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.14);
  transition:transform .4s ease, box-shadow .4s ease, opacity .4s ease, filter .4s ease;
  overflow:hidden;
}
.bigq-card .badge{
  width:2.375rem; height:2.375rem; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:'Oswald',sans-serif; font-weight:700; font-size:1.3125rem; color:#fff; flex-shrink:0;
  box-shadow:0 0 0 2.5px rgba(255,255,255,0.92), 0 2px 6px rgba(0,0,0,0.4);
}
.bigq-card[data-c="A"] .badge{background:radial-gradient(circle at 34% 30%, #6fc2f5, var(--blue));}
.bigq-card[data-c="B"] .badge{background:radial-gradient(circle at 34% 30%, #ff8e9c, var(--red));}
.bigq-card[data-c="C"] .badge{background:radial-gradient(circle at 34% 30%, #7fe0a5, var(--green));}
.bigq-card[data-c="D"] .badge{background:radial-gradient(circle at 34% 30%, #ffe08a, var(--yellow));}
.bigq-card .txt{
  font-weight:900; font-size:1.6875rem; color:#fff; line-height:1.25;
  text-shadow:0 2px 5px rgba(0,0,0,0.6); overflow:hidden;
}
.bigq-card .odds-badge{
  position:absolute; top:50%; right:1.125rem; transform:translateY(-50%); z-index:3;
  background:linear-gradient(180deg,#fff3c4,var(--gold-deep));
  color:#5a3800; font-family:'Oswald',sans-serif; font-weight:700; font-size:1.25rem; padding:0.25rem 0.875rem 0.1875rem;
  border-radius:1.25rem; box-shadow:0 3px 10px rgba(0,0,0,0.45); display:none;
}
.bigq-card .odds-badge.show{display:block;}
.bigq-card.correct{transform:scale(1.04); border-color:var(--gold);
  box-shadow:0 0 0 5px var(--gold), 0 10px 40px rgba(255,210,63,0.7); z-index:2;}
.bigq-card.wrong{opacity:.4; filter:grayscale(.7);}

/* ===================== レイアウトC：問題動画・正解動画 ===================== */
.intro-layout{display:flex; width:100%; height:100%; gap:1.375rem; padding:0.375rem 2.5rem 1.625rem;}
.intro-video-box{flex:1; min-width:0; display:flex; align-items:center; justify-content:center;}
.intro-video-box video{width:100%; height:100%; object-fit:contain;}
/* 通常の紹介動画（レイアウトA/B）では問題文サイドバーを出さず、全画面で再生する */
#introRight{display:none;}
#introScreen.with-question .intro-layout{padding:0.375rem 2.5rem 1.625rem;}
#introScreen.with-question #introRight{display:flex;}
#introScreen:not(.with-question) .intro-layout{padding:0;}

.answer-video-screen{position:absolute; inset:0; z-index:17; display:none; align-items:center; justify-content:center; background:#000;}
.answer-video-screen.show{display:flex;}
.answer-video-screen video{width:100%; height:100%; object-fit:contain;}

/* ===================== 待機画面 ===================== */
.idle-screen{position:absolute; inset:0; z-index:5; display:none; flex-direction:column; align-items:center; justify-content:center;}
.idle-screen.show{display:flex;}
.idle-screen .big{font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:3.625rem; color:#fff;
  text-shadow:0 4px 0 #0e2a4a, 0 10px 30px rgba(0,0,0,0.3); text-align:center; line-height:1.3; margin-bottom:1.125rem;}
.idle-screen .sub{font-size:1rem; color:#eaf6ff; letter-spacing:.25em; font-weight:700;}

/* ===================== タイトル画面 ===================== */
.title-screen{position:absolute; inset:0; z-index:6; display:none; align-items:center; justify-content:center; background:#0e2a4a;}
.title-screen.show{display:flex;}
.title-screen img{width:100%; height:100%; object-fit:cover;}

/* ===================== 順位発表 / 最終結果 共通 ===================== */
.board-screen{position:absolute; inset:0; z-index:10; display:none; flex-direction:column; align-items:center; padding:2.5rem 3.75rem;}
.board-screen.show{display:flex;}
.board-title{font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:2.5rem; color:#fff;
  text-shadow:0 4px 0 #0e2a4a, 0 10px 24px rgba(0,0,0,0.3); margin-bottom:1.125rem; letter-spacing:.05em;}
.board-list{width:100%; max-width:68.75rem; flex:1; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:0.5625rem; padding:0.375rem 0.375rem 1.25rem; scroll-behavior:smooth;
  scrollbar-width:none; -ms-overflow-style:none;}
.board-list::-webkit-scrollbar{display:none; width:0; height:0;}
.board-row{
  display:grid; grid-template-columns:70px 1fr 130px 170px; align-items:center; gap:0.875rem;
  background:rgba(14,42,74,0.55); border:2px solid rgba(255,255,255,0.25); border-radius:0.875rem; padding:0.75rem 1.25rem;
  opacity:0; transform:translateY(24px) scale(0.96); transition:opacity .5s ease, transform .5s ease, background .4s ease, border-color .4s ease;
}
.board-row.revealed{opacity:1; transform:translateY(0) scale(1);}
.board-row.suspense{
  opacity:1; transform:translateY(0) scale(1); justify-content:center;
  background:rgba(14,42,74,0.7); border-color:rgba(255,210,63,0.6);
  animation:suspensePulse 0.9s ease-in-out infinite;
}
.board-row.suspense .board-rank{color:var(--gold);}
.board-row.suspense .board-name{color:#ffe9a8; letter-spacing:.3em;}
@keyframes suspensePulse{
  0%,100%{ box-shadow:0 0 10px rgba(255,210,63,0.25); }
  50%{ box-shadow:0 0 34px rgba(255,210,63,0.75); }
}
.board-row.big-reveal{ animation:bigReveal .85s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes bigReveal{
  0%{ opacity:0; transform:translateY(10px) scale(0.4) rotate(-3deg); }
  55%{ opacity:1; transform:translateY(-6px) scale(1.12) rotate(1deg); }
  75%{ transform:scale(0.98) rotate(0deg); }
  100%{ opacity:1; transform:translateY(0) scale(1) rotate(0deg); }
}
.board-row.rank1{background:linear-gradient(90deg, rgba(255,210,63,0.35), rgba(255,210,63,0.08)); border-color:var(--gold); box-shadow:0 0 30px rgba(255,210,63,0.5);}
.board-row.rank2{background:linear-gradient(90deg, rgba(224,224,235,0.3), rgba(224,224,235,0.06)); border-color:#dcdce6;}
.board-row.rank3{background:linear-gradient(90deg, rgba(205,140,77,0.3), rgba(205,140,77,0.06)); border-color:#cd8c4d;}
.board-rank{font-family:'Oswald',sans-serif; font-weight:700; font-size:1.625rem; text-align:center; color:#fff;}
.board-row.rank1 .board-rank{color:var(--gold); font-size:2rem;}
.board-name{font-weight:900; font-size:1.1875rem; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.board-delta{font-family:'Oswald',sans-serif; font-weight:700; font-size:1rem; text-align:center; padding:0.3125rem 0; border-radius:0.625rem;}
.board-delta.plus{background:rgba(56,176,106,0.3); color:#8fffc0;}
.board-delta.minus{background:rgba(226,57,75,0.3); color:#ff9aa5;}
.board-delta.zero{background:rgba(255,255,255,0.1); color:#cfe0f5;}
.board-pt{font-family:'Oswald',sans-serif; font-weight:700; font-size:1.625rem; color:var(--gold); text-align:right;}
.board-pt .unit{font-size:0.875rem; margin-left:0.1875rem; color:#ffe9a8;}
.board-debt{font-size:0.6562rem; color:#ffb0b8; text-align:right; margin-top:0.125rem;}

/* ===================== 最終結果（優勝演出） ===================== */
#finalScreen .board-title{font-size:2.875rem;}

/* ===================== CHAMPIONバナー（1位＋2位） ===================== */

.champion-banner.show{display:flex;}
@keyframes championFadeIn{ from{opacity:0;} to{opacity:1;} }
/* 画面に収まらない場合は、この要素ごとJSで縮小する（transform-origin:center） */
.champion-inner{display:flex; flex-direction:column; align-items:center; justify-content:center;

.champion-title{font-family:'Oswald',sans-serif; font-weight:700;

@keyframes championDrop{

/* 1位・2位とも「チーム名　◯◯pt」を1行に並べる */

.champion-name{font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900;

.champion-pt{font-family:'Oswald',sans-serif; font-weight:700;

/* 1位＝金色 */
.champion-team.gold .champion-name{color:var(--gold); text-shadow:0 0 28px rgba(255,210,63,0.7), 0 6px 20px rgba(0,0,0,0.55);}

@keyframes championGlow{
  from{text-shadow:0 0 22px rgba(255,210,63,0.45);}
  to{text-shadow:0 0 46px rgba(255,210,63,0.95);}
}

/* 2位＝銀色 */
.second-block{display:flex; flex-direction:column; align-items:center; gap:.6vh;
  margin-top:1.4vh; padding-top:1.4vh; border-top:0.125rem solid rgba(200,215,230,0.28);
  width:min(72vw, 56.25rem); max-width:100%;
  animation:championPop .8s cubic-bezier(.2,1.5,.4,1) 1.15s both;}
.second-title{font-family:'Oswald',sans-serif; font-weight:700;

.champion-team.silver{animation-delay:1.35s;}
.champion-team.silver .champion-name{font-size:min(10.4vh, 7.8vw); color:var(--silver);
  text-shadow:0 0 20px rgba(205,220,235,0.6), 0 4px 14px rgba(0,0,0,0.55);}
.champion-team.silver .champion-pt{font-size:min(11.6vh, 8.6vw); color:var(--silver);
  text-shadow:0 0 22px rgba(205,220,235,0.5);}
.champion-team.silver .champion-pt .unit{color:#e6eef5;}
.shine-silver{
  background:linear-gradient(100deg, #ffffff 0%, var(--silver) 25%, #ffffff 45%, #93a6b8 65%, #ffffff 100%);
  background-size:250% auto; -webkit-background-clip:text; background-clip:text; color:transparent;

}

/* ===================== 解説画面 ===================== */
#explanationScreen{position:absolute; inset:0; z-index:12; display:none; align-items:center; justify-content:center; padding:3.75rem;}
#explanationScreen.show{display:flex;}
.expl-card{background:rgba(14,42,74,0.85); border-radius:1.625rem; padding:2.5rem 3.125rem; max-width:68.75rem; width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,0.4); border:3px solid rgba(255,255,255,0.3); display:flex; gap:2.25rem; align-items:center;}
.expl-media{flex:1; border-radius:1.125rem; overflow:hidden; background:linear-gradient(180deg,#fff7d6,#ffe397); min-height:17.5rem; display:flex; align-items:center; justify-content:center;}
.expl-media img, .expl-media video{width:100%; height:100%; object-fit:cover;}

canvas#confetti{position:fixed; inset:0; z-index:20; pointer-events:none;}
</style>

        <div class="bigq-card" data-c="B">
          <div class="badge">B</div><div class="txt" id="bigTxtB">選択肢B</div>

        </div>
        <div class="bigq-card" data-c="C">
          <div class="badge">C</div><div class="txt" id="bigTxtC">選択肢C</div>
          <div class="odds-badge num" id="bigOddsC"></div>
        </div>
        <div class="bigq-card" data-c="D">
          <div class="badge">D</div><div class="txt" id="bigTxtD">選択肢D</div>
          <div class="odds-badge num" id="bigOddsD"></div>
        </div>

    <div class="quiz-right">
      <div class="q-topbadge">Q</div>
      <div class="q-textbox"><div class="vtext" id="qTextB">問題文がここに表示されます</div></div>

  <!-- ===== レイアウトC：正解動画（運営の指示で大画面・音声つきで1回再生） ===== -->

  <!-- ===== 問題紹介動画／レイアウトCの問題動画（ベット開始前） ===== -->
  <div class="title-screen" id="introScreen" style="background:#000;">
    <div class="intro-layout">

      </div>
      <!-- レイアウトCのときだけ、右端に問題文を表示する -->
      <div class="quiz-right" id="introRight">
        <div class="q-topbadge">Q</div>
        <div class="q-textbox"><div class="vtext" id="qTextIntro">問題文がここに表示されます</div></div>
        <div class="final-tag" id="finalTagIntro">FINAL QUESTION</div>
      </div>

  <!-- ===== 音声有効化ゲート（初回クリックが必要：紹介動画を音声つきで自動再生するため） ===== -->
  <div id="audioGate" style="position:fixed; inset:0; z-index:999; background:rgba(6,20,38,0.94);
      display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; color:#fff; text-align:center;">
    <div style="font-size:54px; margin-bottom:18px;">🔊</div>
    <div style="font-size:26px; font-weight:900;">タップして開始</div>
    <div style="font-size:14px; opacity:.75; margin-top:10px;">問題紹介動画を音声つきで再生するため、最初に1回タップしてください</div>
  </div>

  <div class="idle-screen" id="idleScreen">

  <div class="board-screen" id="rankScreen">
    <div class="board-title shine-gold">👑 途中経過 順位発表 👑</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
 * ★ここだけ書き換えてください（Supabaseの接続情報）
 *   Supabase → Project Settings → API Keys で確認できます
 * ========================================================= */
const SUPABASE_URL = 'https://loknbmgrzbdifwseivqy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WlPJz6_9ctmHHX9Slsdutw_SFkLHyDW';
/* ========================================================= */

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CHOICE_COLORS = { A:'#2f8fdd', B:'#e2394b', C:'#38b06a', D:'#f0b429' };

let serverOffset = 0;
let deadline = null;
let lastPhase = null;
let lastQNo = null;
let introPlayingKey = null;
let answerVideoPlaying = false;      // 正解動画の再生中は正解発表の演出を保留する
let lastAnswerVideoToken = null;     // トークンの変化を検知して正解動画を1回だけ再生する
let titleVideoSrc = null;
let revealedFor = null;
let mediaCache = {}; // 選択肢ごとの現在表示中メディアURLを覚えて無駄な再描画を防ぐ
let flagState = { show_ranking:false, show_final_results:false, show_explanation:false, show_title:false };
let rankRevealTimer = null;
let finalRevealTimer = null;

let audioUnlocked = false;
document.getElementById('audioGate').addEventListener('click', () => {
  const v = document.getElementById('introVideo');
  v.muted = false;
  // 無音の再生→即一時停止で、このタブ内でのユーザー操作による再生許可を得ておく
  // （以降、同じ<video>要素であれば音声つきのプログラム的な再生が許可される）
  v.play().then(()=>{ v.pause(); v.currentTime = 0; }).catch(()=>{});
  audioUnlocked = true;
  document.getElementById('audioGate').style.display = 'none';
});

/* ===================== Supabaseリアルタイム購読 =====================
 * ポーリングは廃止しました。state / teams / questions のいずれかが
 * 変化した瞬間だけ WebSocket で通知が届き、画面を描き直します。
 * （GAS版で問題になっていた「ポーリングが詰まって更新が止まる」現象は
 *   仕組みごと無くなっています）
 * ================================================================== */
let lastReloadToken = null;
let refreshing = false;
let refreshAgain = false;

function setConnStatus(ok, detail){
  const el = document.getElementById('connStatus');
  if(!el) return;
  el.className = 'conn-status' + (ok ? '' : ' bad');
  el.textContent = ok ? '' : ('⚠ 通信エラー' + (detail ? '（' + detail + '）' : '') + ' 再接続中...');
}

/* Supabaseから取得したデータを、既存のrender()が期待する形に組み立てる。
   これにより描画処理（レイアウトA/B/C・演出）は一切変更せずに流用できる。 */
function buildQuestion(q){
  if(!q) return null;
  return {
    q_no: q.q_no,
    text: q.text || '',
    layout: q.layout || 'A',
    choices: { A:q.choice_a||'', B:q.choice_b||'', C:q.choice_c||'', D:q.choice_d||'' },
    // ベット前後で同じメディアを使う運用のため、両方に同じものを入れる
    media_before: { A:q.media_a||'', B:q.media_b||'', C:q.media_c||'', D:q.media_d||'' },
    media_after:  { A:q.media_a||'', B:q.media_b||'', C:q.media_c||'', D:q.media_d||'' },
    main_media: q.main_media || '',
    answer_video: q.answer_video || '',
    intro_video: q.intro_video || '',
    explanation_text: q.explanation_text || '',
    explanation_media: q.explanation_media || '',
    odds_multiplier: Number(q.odds_multiplier) || 1,
    correct: q.revealed_correct || null,
    revealed: !!q.revealed_correct
  };
}

async function refresh(){
  // 連続で通知が来ても処理が重ならないようにする
  if(refreshing){ refreshAgain = true; return; }
  refreshing = true;
  try{
    const { data: st, error: e1 } = await db.from('state').select('*').eq('id',1).single();
    if(e1) throw e1;

    const qNo = Number(st.current_q) || 0;
    const [{ data: qRow }, { data: rk, error: e2 }, { data: hist }] = await Promise.all([
      qNo > 0 ? db.from('questions').select(QCOLS).eq('q_no', qNo).single()
              : Promise.resolve({ data:null }),
      db.rpc('ranking'),
      qNo > 0 ? db.from('history').select('team_id,delta').eq('q_no', qNo)
              : Promise.resolve({ data:[] })
    ]);
    if(e2) throw e2;

    // 直前の問題での増減（順位表の「+120pt」表示用）
    const deltaMap = {};
    (hist || []).forEach(h => { deltaMap[h.team_id] = Number(h.delta); });

    const ranking = (rk || []).map(t => ({
      team_id: t.team_id, team_name: t.team_name,
      points: t.points, debt: t.debt, net_points: t.net_points,
      correct_count: t.correct_count, total_bet: t.total_bet,
      rank: Number(t.rank),
      last_delta: deltaMap.hasOwnProperty(t.team_id) ? deltaMap[t.team_id] : null
    }));

    const data = {
      ok: true,
      event_name: st.event_name,
      phase: st.phase,
      current_q: qNo,
      // Supabaseのdeadlineは絶対時刻なので、端末ごとの補正は不要
      deadline: st.deadline ? new Date(st.deadline).getTime() : null,
      question: buildQuestion(qRow),
      odds: (st.odds && Object.keys(st.odds).length) ? st.odds : null,
      odds_multiplier: qRow ? (Number(qRow.odds_multiplier) || 1) : 1,
      show_ranking: st.show_ranking,
      show_final_results: st.show_final_results,
      show_explanation: st.show_explanation,
      show_title: st.show_title,
      show_team_results: st.show_team_results,
      title_image_url: st.title_image_url || '',
      answer_video_token: st.answer_video_token || '',
      reload_token: st.reload_token || '',
      ranking: ranking
    };

    // 運営パネルの「強制リロード」に反応する（初回はトークンを覚えるだけ）
    if(lastReloadToken === null){
      lastReloadToken = data.reload_token;
    } else if(data.reload_token !== lastReloadToken){
      location.reload();
      return;
    }

    setConnStatus(true);
    render(data, 0);   // 第2引数は時刻補正。Supabaseでは不要なので0
  }catch(err){
    setConnStatus(false, err && err.message ? err.message : '');
    console.error('[refresh] 取得に失敗しました:', err);
  }finally{
    refreshing = false;
    if(refreshAgain){ refreshAgain = false; refresh(); }
  }
}

/* ===== 通知のまとめ処理（レスポンス低下対策） =====
 * 正解を確定すると teams 24行 + history 24行 + state 1行 が一度に書き換わり、
 * そのぶん通知が連続して飛んできます。1件ごとに読み直すと1回の精算で
 * 数十回の往復が発生し、処理しきる前に次が来て遅延が積み上がります。
 * そこで「最初の通知から120ms待ち、その間に来た通知はまとめて1回だけ処理」
 * する方式にしました。表示の速さは変えずに、往復回数を大幅に減らせます。 */
const QCOLS = 'q_no,text,layout,choice_a,choice_b,choice_c,choice_d,'
            + 'media_a,media_b,media_c,media_d,main_media,intro_video,answer_video,'
            + 'explanation_text,explanation_media,odds_multiplier,revealed_correct';
const BURST_WAIT_MS = 120;
let burstTimer = null;
function scheduleRefresh(){
  if(burstTimer) return;              // すでに予約済みなら何もしない
  burstTimer = setTimeout(() => { burstTimer = null; refresh(); }, BURST_WAIT_MS);
}

db.channel('quiz-screen')
  .on('postgres_changes', { event:'*', schema:'public', table:'state'     }, scheduleRefresh)
  .on('postgres_changes', { event:'*', schema:'public', table:'teams'     }, scheduleRefresh)
  .on('postgres_changes', { event:'*', schema:'public', table:'questions' }, scheduleRefresh)
  .subscribe((status) => {
    if(status === 'SUBSCRIBED'){ setConnStatus(true); refresh(); }
    else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){
      setConnStatus(false, 'リアルタイム接続が切れました');
    }
  });

// 保険：通知を取りこぼしても必ず追いつくよう、30秒ごとに読み直す
setInterval(refresh, 30000);

function render(data, offset){
  serverOffset = offset;
  deadline = data.deadline;
  document.title = (data.event_name || 'クイズ大会') + ' - スクリーン';
  setPhaseBadge(data.phase);

  // オッズ倍率バッジ（等倍のときは出さない）
  try{
    const mult = Number(data.odds_multiplier) || 1;
    const mb = document.getElementById('multBadge');
    mb.classList.toggle('show', mult > 1);
    if(mult > 1) mb.textContent = '🔥 オッズ ' + mult + '倍';
  }catch(err){ /* バッジの失敗が他の描画に影響しないようにする */ }

  // ---- 表示優先度: 最終結果 > 順位発表 > 解説 > タイトル > クイズ/待機 ----
  const showFinal = !!data.show_final_results;
  const showRank = !!data.show_ranking;
  const showExpl = !!data.show_explanation;
  const showTitle = !!data.show_title;

  // 途中順位・最終結果の画面では、ヘッダー（フェーズ表示・オッズ倍率バッジ）を隠す。
  // これらの画面は背景が透けるため、隠さないとヘッダーが見えたままになる。
  document.getElementById('stage').classList.toggle('board-mode', showFinal || showRank);

  document.getElementById('finalScreen').classList.toggle('show', showFinal);
  document.getElementById('rankScreen').classList.toggle('show', !showFinal && showRank);
  document.getElementById('explanationScreen').classList.toggle('show', !showFinal && !showRank && showExpl);
  const titleEl = document.getElementById('titleScreen');
  const showTitleNow = !showFinal && !showRank && !showExpl && showTitle && !!data.title_image_url;
  titleEl.classList.toggle('show', showTitleNow);
  if(showTitleNow){
    const img = document.getElementById('titleImg');
    const vid = document.getElementById('titleVideo');
    if(!flagState.show_title) resetQuizVisual(); // タイトル表示開始時、スクリーンの見た目だけを初期状態に戻す（データは変更しない）
    try{
      if(isVideoUrl(data.title_image_url)){
        img.style.display = 'none';
        vid.style.display = 'block';
        if(titleVideoSrc !== data.title_image_url){
          titleVideoSrc = data.title_image_url;
          vid.pause();
          vid.src = data.title_image_url;
          vid.loop = false;
          vid.muted = true; // タイトル動画は音声なし仕様
          vid.currentTime = 0;
          vid.load();
          const playAttempt = () => vid.play().catch(()=>{});
          if(vid.readyState >= 2) playAttempt();
          else vid.addEventListener('loadedmetadata', playAttempt, { once:true });
        }
      } else {
        if(titleVideoSrc !== null){ vid.pause(); titleVideoSrc = null; }
        vid.style.display = 'none';
        img.style.display = 'block';
        if(img.getAttribute('src') !== data.title_image_url) img.setAttribute('src', data.title_image_url);
      }
    }catch(err){ /* タイトルメディアのエラーが他の描画に影響しないようにする */ }
  } else if(titleVideoSrc !== null){
    document.getElementById('titleVideo').pause();
    titleVideoSrc = null;
  }

  // ---- 問題紹介動画／レイアウトCの問題動画（ベット開始前・INTROフェーズ） ----
  const layout = (data.question && data.question.layout) ? data.question.layout : 'A';
  const showIntro = !showFinal && !showRank && !showExpl && !showTitleNow &&
    data.phase === 'INTRO' && data.question && !!data.question.intro_video;
  const introEl = document.getElementById('introScreen');
  introEl.classList.toggle('show', showIntro);
  // レイアウトCのときだけ、問題動画の右端に問題文を出す
  introEl.classList.toggle('with-question', showIntro && layout === 'C');
  if(showIntro && layout === 'C' && data.question){
    setVerticalText(document.getElementById('qTextIntro'), data.question.text);
    document.getElementById('finalTagIntro').classList.toggle('show', Number(data.question.q_no) === 10);
  }
  try{
    const v = document.getElementById('introVideo');
    if(showIntro){
      // 独立したキーで「今再生すべき動画」を判定する（他の処理で例外が起きても
      // ここが巻き込まれて毎秒動画が0秒に巻き戻る、という事態を防ぐため）
      const key = String(data.question.q_no) + '|' + data.question.intro_video;
      if(introPlayingKey !== key){
        introPlayingKey = key;
        v.pause();
        v.src = data.question.intro_video;
        v.loop = false;
        v.muted = !audioUnlocked; // 未解錠なら念のためミュートで確実に再生だけは開始する
        v.currentTime = 0;
        v.load();
        const playAttempt = () => v.play().catch(()=>{});
        if(v.readyState >= 2) playAttempt();
        else v.addEventListener('loadedmetadata', playAttempt, { once:true });
      }
    } else if(introPlayingKey !== null){
      introPlayingKey = null;
      v.pause();
    }
  }catch(err){ /* 動画再生でのエラーが他の描画処理に影響しないようにする */ }

  // ---- レイアウトC：正解動画（運営がボタンを押すとトークンが変わる → 1回だけ再生） ----
  try{
    const token = data.answer_video_token || '';
    if(lastAnswerVideoToken === null){
      lastAnswerVideoToken = token; // 初回はトークンを記憶するだけ（リロード時の誤再生を防ぐ）
    } else if(token && token !== lastAnswerVideoToken){
      lastAnswerVideoToken = token;
      if(data.question && data.question.answer_video) playAnswerVideo(data.question.answer_video);
    }
  }catch(err){ console.error('[render] 正解動画の再生でエラー:', err); }

  const hideQuiz = showFinal||showRank||showExpl||showTitleNow||showIntro;
  // レイアウトBのときだけB用画面を使い、それ以外（A/C）は従来の4分割画面を使う
  const useB = layout === 'B';
  const quizA = document.getElementById('quizScreen');
  // ⚠ レイアウトBを使うときは、4分割画面を visibility:hidden ではなく display:none で消す。
  //    visibility:hidden は「見えないが場所は占有したまま」なので、高さ100vhの4分割画面が
  //    残ってしまい、その下に置かれるB用画面が画面外に押し出されて見えなくなるため。
  quizA.style.display = useB ? 'none' : '';
  quizA.style.visibility = hideQuiz ? 'hidden' : 'visible';
  document.getElementById('quizScreenB').classList.toggle('show', !hideQuiz && useB && !!data.question);

  try{
    const idle = document.getElementById('idleScreen');
    idle.classList.toggle('show', !showFinal && !showRank && !showExpl && !showTitleNow && !showIntro && (data.phase === 'IDLE' || !data.question));

    if(showFinal && !flagState.show_final_results) startFinalReveal(data.ranking);
    if(!showFinal) hideChampionBanner();
    if(showRank && !flagState.show_ranking) startRankReveal(data.ranking);
    if(showExpl && data.question) renderExplanation(data.question);
  }catch(err){ console.error('[render] 順位/最終結果/解説の描画でエラー:', err); }
  // showX系のフラグ更新自体は、上の演出描画で例外が起きても必ず反映する
  // （ここが更新されないと、次回以降ずっと「表示済み」判定がズレたままになり、
  //   本編（renderQuiz）まで巻き込んで永久に固まる原因になるため）
  flagState = { show_ranking:showRank, show_final_results:showFinal, show_explanation:showExpl, show_title:showTitleNow };

  try{
    if(!showFinal && !showRank && !showExpl && !showTitleNow && !showIntro && data.question){
      renderQuiz(data);
    }
  }catch(err){ console.error('[render] クイズ本編（renderQuiz）の描画でエラー:', err); }

  lastPhase = data.phase;
  lastQNo = data.question ? data.question.q_no : null;
}

/* URLの拡張子から動画ファイルかどうかを簡易判定する（タイトル画面の画像/動画自動判別に使用） */

}

/* ===================== 縦書き問題文の縦中横（たてちゅうよこ） =====================
 * 縦書きでは、半角の数字やアルファベットは標準では「寝た（横倒しの）」状態で表示されます。
 * そこで、短い半角の並びだけを正立させて横に組み（＝縦中横）、自然な縦書きに見せます。
 *
 * しきい値：長すぎる並びを縦中横にすると、1文字分の幅に押し込められて潰れてしまうため、
 * 一定の長さを超えるものは日本語縦書きの慣習どおり寝かせたままにします。
 * 会場や問題文の内容に合わせて、この2つの数値を調整してください。
 * ================================================================================= */
const TCY_MAX_DIGITS = 4;   // 数字：この文字数までを縦中横にする（例 4 → 「2026」までOK）
const TCY_MAX_LETTERS = 3;  // 英字：この文字数までを縦中横にする（例 3 → 「AI」「DX」「NHK」までOK）

/* 問題文を縦中横つきで要素に流し込む（textContentの代わりに使う） */
function setVerticalText(el, text){
  if(!el) return;
  el.innerHTML = buildTateChuYoko(text);
}

function buildTateChuYoko(text){
  const s = String(text == null ? '' : text);
  let out = '';
  // 半角の数字のかたまり／英字のかたまり／それ以外、に分解する
  // （数字は小数点やカンマを含めて1つのかたまりとして扱う。例：「1,000」「3.14」）
  const re = /[0-9]+(?:[.,][0-9]+)*|[A-Za-z]+/g;
  let last = 0, m;
  while((m = re.exec(s)) !== null){
    if(m.index > last) out += escapeHtml(s.slice(last, m.index));
    const token = m[0];
    const isDigit = /^[0-9]/.test(token);
    // しきい値は「小数点やカンマを除いた文字数」で判定する
    // （「1,000」は4桁として扱い、区切り記号のせいで寝てしまうのを防ぐ）
    const coreLen = token.replace(/[.,]/g, '').length;
    const max = isDigit ? TCY_MAX_DIGITS : TCY_MAX_LETTERS;
    // 区切り記号を含めても詰め込みすぎない上限（潰れ防止）
    const fits = coreLen <= max && token.length <= max + 2;
    out += '<span class="' + (fits ? 'tcy' : 'tcy-long') + '">' + escapeHtml(token) + '</span>';
    last = m.index + token.length;
  }
  if(last < s.length) out += escapeHtml(s.slice(last));
  return out;
}

/* 順位を英語の序数に変換する（2位が同率1位の影響で3位になる場合などに対応） */
function ordinal(n){
  const v = Number(n);
  if(!isFinite(v) || v < 1) return '';
  const rem100 = v % 100, rem10 = v % 10;
  if(rem100 >= 11 && rem100 <= 13) return v + 'th';
  if(rem10 === 1) return v + 'st';
  if(rem10 === 2) return v + 'nd';
  if(rem10 === 3) return v + 'rd';
  return v + 'th';
}

/* CHAMPIONバナー：1位発表の直後に、1位（金色）と2位（銀色）を表示する
   1行目 CHAMPION ／ 2行目 チーム名＋pt ／ 3行目 2nd ／ 4行目 チーム名＋pt
   （同率が複数いる場合はその順位のチームを全て並べて表示する） */
function showChampionBanner(champions, seconds, secondRank){
  const el = document.getElementById('championBanner');
  const list = document.getElementById('championList');
  const secondBlock = document.getElementById('secondBlock');
  const secondList = document.getElementById('secondList');

  const champs = champions || [];
  list.innerHTML = '';
  champs.forEach(t => list.appendChild(buildChampionRow(t, 'gold')));

  // 同率1位が2チーム以上いる場合は、優勝チームだけを見せて2位は表示しない
  const tiedForFirst = champs.length >= 2;
  secondList.innerHTML = '';
  const hasSecond = !tiedForFirst && seconds && seconds.length > 0;
  secondBlock.style.display = hasSecond ? 'flex' : 'none';
  if(hasSecond){
    document.getElementById('secondTitle').textContent = ordinal(secondRank || 2);
    seconds.forEach(t => secondList.appendChild(buildChampionRow(t, 'silver')));
  }

  el.classList.add('show');
  fitChampionBanner();
}

/* 行数やチーム名の長さによってはみ出す場合に、全体を縮小して画面内に収める */
function fitChampionBanner(){
  const banner = document.getElementById('championBanner');
  const inner = document.getElementById('championInner');
  if(!banner || !inner) return;
  inner.style.transform = 'scale(1)';
  // アニメーション中の拡大(scale1.12等)で誤判定しないよう、確定後に測る
  setTimeout(()=>{
    try{
      const availH = banner.clientHeight * 0.94;
      const availW = banner.clientWidth * 0.90;
      const needH = inner.scrollHeight;
      const needW = inner.scrollWidth;
      if(needH <= 0 || needW <= 0) return;
      const scale = Math.min(1, availH / needH, availW / needW);
      inner.style.transform = 'scale(' + (scale < 0.3 ? 0.3 : scale) + ')';
    }catch(err){ /* 収まり調整の失敗は致命的ではない */ }
  }, 2300); // 2位の登場アニメーション（1.35s + 0.8s）の完了後
}

function hideChampionBanner(){
  document.getElementById('championBanner').classList.remove('show');
}

/* ===================== クイズ画面描画 ===================== */
function renderQuiz(data){
  const layout = data.question.layout || 'A';
  if(layout === 'B') renderQuizB(data);
  else renderQuizA(data);
}

/* レイアウトA（4分割ノーマル）／レイアウトC（動画再生後の選択肢画面） */
function renderQuizA(data){
  setVerticalText(document.getElementById('qText'), data.question.text);
  document.getElementById('finalTag').classList.toggle('show', Number(data.question.q_no) === 10);

  const useAfter = (data.phase === 'BETTING_CLOSED' || data.phase === 'REVEALED');
  // 正解動画の再生中は、正解発表の演出を保留する（動画が終わってから発表する）
  const revealed = data.question.revealed && data.question.correct && !answerVideoPlaying;

  ['A','B','C','D'].forEach(c=>{
    document.getElementById('txt'+c).textContent = data.question.choices[c];
    const url = useAfter ? data.question.media_after[c] : data.question.media_before[c];
    setCardMedia(c, url);

    const oddsEl = document.getElementById('odds'+c);
    if(data.odds && data.odds[c]){
      oddsEl.textContent = data.odds[c].toFixed(1) + '倍';
      oddsEl.classList.add('show');
    } else {
      oddsEl.classList.remove('show');
    }

    const card = document.querySelector('.qcard[data-c="'+c+'"]');
    card.classList.remove('correct','wrong');
    if(revealed) card.classList.add(c === data.question.correct ? 'correct' : 'wrong');
  });

  if(revealed){
    const key = data.question.q_no + '_' + data.question.correct;
    if(revealedFor !== key){ revealedFor = key; launchConfetti(60); }
  }
}

/* レイアウトB（上部に大メディア＋下部にテキストのみの選択肢） */
function renderQuizB(data){
  setVerticalText(document.getElementById('qTextB'), data.question.text);
  document.getElementById('finalTagB').classList.toggle('show', Number(data.question.q_no) === 10);

  // ベット前後で同じメディアを使う（main_media 1つで完結する）
  setBigMedia(data.question.main_media);

  const revealed = data.question.revealed && data.question.correct && !answerVideoPlaying;

  ['A','B','C','D'].forEach(c=>{
    document.getElementById('bigTxt'+c).textContent = data.question.choices[c];

    const oddsEl = document.getElementById('bigOdds'+c);
    if(data.odds && data.odds[c]){
      oddsEl.textContent = data.odds[c].toFixed(1) + '倍';
      oddsEl.classList.add('show');
    } else {
      oddsEl.classList.remove('show');
    }

    const card = document.querySelector('.bigq-card[data-c="'+c+'"]');
    card.classList.remove('correct','wrong');
    if(revealed) card.classList.add(c === data.question.correct ? 'correct' : 'wrong');
  });

  if(revealed){
    const key = data.question.q_no + '_' + data.question.correct;
    if(revealedFor !== key){ revealedFor = key; launchConfetti(60); }
  }
}

/* レイアウトBの大メディア枠を描画する（動画は音声なしでループ再生） */
function setBigMedia(url){
  if(mediaCache['bigq'] === (url || '')) return; // 変化なければ再描画しない（動画の再読込防止）
  mediaCache['bigq'] = url || '';
  const box = document.getElementById('bigqMedia');
  box.querySelectorAll('img,video,iframe,.placeholder-letter').forEach(el=>el.remove());
  const info = classifyMedia(url);
  if(info.kind === 'video'){
    const v = document.createElement('video');
    v.src = url; v.autoplay = true; v.muted = true; v.loop = true; v.playsInline = true;
    box.appendChild(v);
  } else if(info.kind === 'drive_embed'){
    const f = document.createElement('iframe');
    f.src = url; f.setAttribute('allow','autoplay');
    box.appendChild(f);
  } else if(info.kind === 'image'){
    const img = document.createElement('img');
    img.src = url;
    box.appendChild(img);
  } else {
    const span = document.createElement('span');
    span.className = 'placeholder-letter num';
    span.textContent = '?';
    box.appendChild(span);
  }
}

/* レイアウトCの正解動画：大画面・音声つきで1回だけ再生し、終わったら選択肢画面に戻る */
function playAnswerVideo(url){
  const screenEl = document.getElementById('answerVideoScreen');
  const v = document.getElementById('answerVideo');
  answerVideoPlaying = true;
  screenEl.classList.add('show');
  v.pause();
  v.muted = !audioUnlocked; // 未解錠なら念のためミュートで確実に再生だけは開始する
  v.loop = false;
  v.src = url;
  v.currentTime = 0;
  v.load();
  const finish = () => {
    answerVideoPlaying = false;
    screenEl.classList.remove('show');
  };
  v.addEventListener('ended', finish, { once:true });
  v.addEventListener('error', finish, { once:true });
  const playAttempt = () => v.play().catch(()=>{ finish(); });
  if(v.readyState >= 2) playAttempt();
  else v.addEventListener('loadedmetadata', playAttempt, { once:true });
}

function classifyMedia(url){
  if(!url) return { kind:'empty' };
  if(/drive\.google\.com\/file\/d\/.+\/preview/i.test(url)) return { kind:'drive_embed' };
  if(/\.(mp4|webm|mov|ogg)(\?.*)?$/i.test(url)) return { kind:'video' };
  return { kind:'image' };
}

function setCardMedia(c, url){
  const key = 'q' + c;
  if(mediaCache[key] === (url || '')) return; // 変化なければ再描画しない（動画の再読込防止）
  mediaCache[key] = url || '';
  const mediaBox = document.querySelector('.qcard[data-c="'+c+'"] .media');
  mediaBox.querySelectorAll('img,video,iframe,.placeholder-letter').forEach(el=>el.remove());
  const info = classifyMedia(url);
  if(info.kind === 'video'){
    const v = document.createElement('video');
    v.src = url; v.autoplay = true; v.muted = true; v.loop = false; v.playsInline = true;
    mediaBox.prepend(v);
  } else if(info.kind === 'drive_embed'){
    const f = document.createElement('iframe');
    f.src = url; f.setAttribute('allow','autoplay'); f.style.cssText = 'width:100%;height:100%;border:0;';
    mediaBox.prepend(f);
  } else if(info.kind === 'image'){
    const img = document.createElement('img');
    img.src = url;
    mediaBox.prepend(img);
  } else {
    const span = document.createElement('span');
    span.className = 'placeholder-letter num';
    span.textContent = c;
    mediaBox.prepend(span);
  }
}

/* ===================== 解説画面 ===================== */
function renderExplanation(q){
  document.getElementById('explText').textContent = q.explanation_text || '(解説は設定されていません)';
  const box = document.getElementById('explMedia');

  const info = classifyMedia(q.explanation_media);
  if(info.kind === 'video'){

    v.src = q.explanation_media; v.autoplay = true; v.muted = true; v.loop = false; v.playsInline = true;
    box.appendChild(v);
  } else if(info.kind === 'drive_embed'){
    const f = document.createElement('iframe');
    f.src = q.explanation_media; f.setAttribute('allow','autoplay'); f.style.cssText = 'width:100%;height:100%;border:0;';
    box.appendChild(f);
  } else if(info.kind === 'image'){
    const img = document.createElement('img');
    img.src = q.explanation_media;
    box.appendChild(img);
  } else {
    const span = document.createElement('span');
    span.className = 'placeholder-letter num'; span.style.color = '#f4d888';
    span.textContent = '?';
    box.appendChild(span);
  }
}

/* ===================== 順位発表（下位→上位に順次表示） ===================== */
function buildBoardRow(t, pos){
  // pos は「発表する順番」、rank は「実際に表示する順位」。
  // 同率がある場合、両者はズレる（例: 1,2,2,4）ためサーバー算出のrankを優先する。
  const rank = (t.rank !== null && t.rank !== undefined) ? t.rank : pos;
  const row = document.createElement('div');
  row.className = 'board-row' + (rank===1?' rank1':rank===2?' rank2':rank===3?' rank3':'');
  let deltaHtml = '';
  if(t.last_delta !== null && t.last_delta !== undefined){
    const cls = t.last_delta > 0 ? 'plus' : (t.last_delta < 0 ? 'minus' : 'zero');
    const sign = t.last_delta > 0 ? '+' : '';
    deltaHtml = '<div class="board-delta '+cls+'">' + sign + t.last_delta + 'pt</div>';
  } else {
    deltaHtml = '<div class="board-delta zero">-</div>';
  }
  const debtHtml = t.debt > 0 ? '<div class="board-debt">(借入 ' + t.debt + 'pt含む)</div>' : '';
  row.innerHTML =
    '<div class="board-rank num">' + (rank<=3 ? ['🥇','🥈','🥉'][rank-1] : rank) + '</div>' +
    '<div class="board-name">' + escapeHtml(t.team_name) + '</div>' +
    deltaHtml +
    '<div><div class="board-pt">' + t.net_points + '<span class="unit">pt</span></div>' + debtHtml + '</div>';
  return row;
}

function startRankReveal(ranking){
  clearInterval(rankRevealTimer);
  const wrap = document.getElementById('rankList');
  wrap.innerHTML = '';
  const total = ranking.length;
  // ranking は net_points 降順（1位が先頭）。下位（配列末尾）から順に見せる。
  const order = [...ranking].map((t,i)=>({t, pos:i+1})).reverse(); // 最下位から
  let idx = 0;
  function step(){
    if(idx >= order.length){ clearInterval(rankRevealTimer); return; }
    const { t, pos } = order[idx];
    const row = buildBoardRow(t, pos);
    wrap.appendChild(row);
    requestAnimationFrame(()=>{ row.classList.add('revealed'); row.scrollIntoView({block:'end', behavior:'smooth'}); });
    if(pos <= 3) launchConfetti(24);
    idx++;
    const delay = (total - pos <= 4) ? 1100 : 420; // 上位に近づくほどゆっくり
    rankRevealTimer = setTimeout(step, delay);
  }
  step();
}

/* ===================== 最終結果発表 ===================== */
function buildSuspenseRow(pos, t){
  const rank = (t && t.rank !== null && t.rank !== undefined) ? t.rank : pos;
  const row = document.createElement('div');
  row.className = 'board-row suspense';
  row.innerHTML =
    '<div class="board-rank num">' + rank + '</div>' +
    '<div class="board-name">? ? ?</div>' +
    '<div></div><div></div>';
  return row;
}

function startFinalReveal(ranking){
  clearInterval(finalRevealTimer);
  hideChampionBanner();
  const wrap = document.getElementById('finalList');
  wrap.innerHTML = '';
  const total = ranking.length;
  const order = [...ranking].map((t,i)=>({t, pos:i+1})).reverse();
  let idx = 0;
  function step(){
    if(idx >= order.length){
      finalRevealTimer = setTimeout(()=>{
        clearInterval(finalRevealTimer);
        launchConfetti(220);
        // 1位（金色）と、その次の順位＝2位（銀色）を CHAMPION バナーで表示する。
        // 同率が複数いる場合はその順位のチームを全員表示する。
        // サーバーがrankを返さない場合に備え、並び順（1位が先頭）から補う
        const hasRank = ranking.some(t => t.rank !== null && t.rank !== undefined);
        const rankOf = (t, i) => hasRank ? Number(t.rank) : (i + 1);

        const ranks = ranking.map(rankOf);
        let champions = ranking.filter((t,i) => ranks[i] === 1);
        if(!champions.length) champions = ranking.slice(0, 1);

        // 同率1位が2チームいる場合、次の順位は3位になる。実際の順位を調べてラベルに使う。
        const secondRank = ranks.filter(r => r > 1).sort((a,b) => a - b)[0] || null;
        const seconds = secondRank ? ranking.filter((t,i) => ranks[i] === secondRank) : [];

        showChampionBanner(champions, seconds, secondRank);
      }, 900);
      return;
    }
    const { t, pos } = order[idx];
    const isTop5 = pos <= 5;

    if(isTop5){
      // TOP5だけ「じらし」を入れてから重厚感のあるアニメーションで発表する
      const placeholder = buildSuspenseRow(pos, t);
      wrap.appendChild(placeholder);
      placeholder.scrollIntoView({block:'end', behavior:'smooth'});
      const holdMs = 700 + (6 - pos) * 350; // 1位に近づくほど長く溜める（5位:1400ms 〜 1位:2800ms）
      finalRevealTimer = setTimeout(()=>{
        const row = buildBoardRow(t, pos);
        row.classList.add('big-reveal');
        wrap.replaceChild(row, placeholder);
        row.scrollIntoView({block:'end', behavior:'smooth'});
        launchConfetti(pos === 1 ? 90 : pos <= 3 ? 60 : 36);
        idx++;
        const nextDelay = 1000 + (6 - pos) * 250;
        finalRevealTimer = setTimeout(step, nextDelay);
      }, holdMs);
    } else {
      const row = buildBoardRow(t, pos);
      wrap.appendChild(row);
      requestAnimationFrame(()=>{ row.classList.add('revealed'); row.scrollIntoView({block:'end', behavior:'smooth'}); });
      idx++;
      finalRevealTimer = setTimeout(step, 420);
    }
  }
  step();
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }

/* ===================== タイマー ===================== */
function tickTimer(){
  // レイアウトA/C用とレイアウトB用、両方のタイマーを同じ内容で更新する
  const pairs = [
    [document.getElementById('timerCircle'), document.getElementById('timerNum')],
    [document.getElementById('timerCircleB'), document.getElementById('timerNumB')]
  ];
  const active = deadline && lastPhase === 'BETTING_OPEN';
  let secs = '-', urgent = false;
  if(active){
    const remain = Math.max(0, deadline - (Date.now()+serverOffset));
    secs = Math.ceil(remain/1000);
    urgent = remain < 10000 && remain > 0;
  }
  pairs.forEach(([circle, num])=>{
    if(!circle || !num) return;
    num.textContent = secs;
    circle.classList.toggle('urgent', urgent);
  });
}

/* ===================== 紙吹雪 ===================== */
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resizeCanvas(); addEventListener('resize', resizeCanvas);
let particles = [];
function launchConfetti(n){
  const colors = ['#ffd23f','#f5a623','#e2394b','#2f8fdd','#38b06a','#ffffff'];
  for(let i=0;i<n;i++){
    particles.push({
      x: innerWidth/2 + (Math.random()-0.5)*innerWidth*0.7, y: -20,
      vx: (Math.random()-0.5)*4, vy: Math.random()*3+2, g:0.18,
      size: Math.random()*7+4, color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*360, vr:(Math.random()-0.5)*12, life: 220
    });
  }
}
function animateConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.vy += p.g*0.05; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
    ctx.fillStyle = p.color; ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
    ctx.restore();
  });
  particles = particles.filter(p=>p.life>0 && p.y < innerHeight+50);
  requestAnimationFrame(animateConfetti);
}
animateConfetti();

/* ===================== 背景演出：漂う泡＆きらめく星 ===================== */
function initAmbientFX(){
  const stage = document.getElementById('stage');
  // 泡
  for(let i=0;i<14;i++){
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 18 + Math.random()*70;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = Math.random()*100 + '%';
    b.style.top = (60 + Math.random()*40) + '%';
    b.style.setProperty('--drift', (Math.random()*60-30) + 'px');
    b.style.animationDuration = (10 + Math.random()*14) + 's';
    b.style.animationDelay = (Math.random()*14) + 's';
    stage.appendChild(b);
  }
  // 星
  for(let i=0;i<10;i++){
    const s = document.createElement('div');
    s.className = 'star-fx';
    s.textContent = '★';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*90 + '%';
    s.style.fontSize = (14 + Math.random()*22) + 'px';
    s.style.setProperty('--driftx', (Math.random()*80-40) + 'px');
    s.style.animationDuration = (2.5 + Math.random()*2.5) + 's, ' + (16 + Math.random()*10) + 's';
    s.style.animationDelay = (Math.random()*3) + 's, 0s';
    stage.appendChild(s);
  }
}
initAmbientFX();

// pollは自分自身で次回を予約するため、setIntervalは使わない（リクエストの多重化防止）
setInterval(tickTimer, 200);
refresh();
</script>
